# XcodeGen project definition. Generate the Xcode project with:  xcodegen generate
name: SculptForge
options:
  bundleIdPrefix: com.sculptforge
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    CLANG_CXX_LIBRARY: "libc++"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: "NO"
    GCC_ENABLE_CPP_EXCEPTIONS: "YES"
targets:
  SculptForge:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Engine/src
      - path: Engine/include
        buildPhase: none
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SculptForge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [metal]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: "SculptForge saves rendered images to your photo library when you choose Save Image."
        NSPhotoLibraryUsageDescription: "SculptForge lets you choose photo references for 3D sculpting."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.sculptforge.project
            UTTypeDescription: SculptForge Project
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sculptforge]
        CFBundleDocumentTypes:
          - CFBundleTypeName: SculptForge Project
            LSHandlerRank: Owner
            CFBundleTypeRole: Editor
            LSItemContentTypes: [com.sculptforge.project]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sculptforge.app
        PRODUCT_NAME: SculptForge
        SWIFT_OBJC_BRIDGING_HEADER: App/SculptForge-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Engine/include"]
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)"]
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: "2"   # the C++ engine is unusably slow at -O0 on dense meshes
        Release:
          GCC_OPTIMIZATION_LEVEL: "3"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
