# Self-contained Codemagic build: includes a fallback copy of the app source.
# Complete checkout sources take priority. Upload this file as codemagic.yaml.
workflows:
  sculptforge-unsigned-ios:
    name: "SculptForge \u2014 unsigned IPA (Sideloadly)"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
