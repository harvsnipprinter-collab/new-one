        export HOMEBREW_NO_INSTALL_CLEANUP=1
        if ! command -v xcodegen >/dev/null 2>&1; then
          brew install xcodegen
        fi
        xcodegen generate --spec project.yml
        test -f SculptForge.xcodeproj/project.pbxproj
        xcodebuild -list -project SculptForge.xcodeproj
        xcodebuild -version
    - name: Ensure Metal compiler is installed
      script: |
        set -euo pipefail
        if ! xcrun --find metal >/dev/null 2>&1; then
          xcodebuild -downloadComponent MetalToolchain
        fi
        xcrun --find metal
    - name: Archive iOS device app (no signing)
      script: |
        set -euo pipefail
        ROOT="${CM_BUILD_DIR:-$PWD}"
        APP_ROOT="$(cat "$ROOT/.sculptforge-build-root")"
        cd "$APP_ROOT"
        test -d SculptForge.xcodeproj || { echo 'ERROR: SculptForge.xcodeproj missing: project generation failed'; exit 1; }
        mkdir -p "$ROOT/build"
        xcodebuild archive \
          -project SculptForge.xcodeproj \
          -scheme SculptForge \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath "$ROOT/build/SculptForge.xcarchive" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          2>&1 | tee "$ROOT/build/archive.log"
    - name: Package unsigned IPA
      script: |
        set -euo pipefail
        ROOT="${CM_BUILD_DIR:-$PWD}"
        APP_ROOT="$(cat "$ROOT/.sculptforge-build-root")"
        bash "$APP_ROOT/Scripts/make_ipa.sh" \
          "$ROOT/build/SculptForge.xcarchive" \
          "$ROOT/build/SculptForge-unsigned.ipa"
        unzip -t "$ROOT/build/SculptForge-unsigned.ipa"
    artifacts:
    - build/SculptForge-unsigned.ipa
    - build/archive.log
