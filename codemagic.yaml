# SculptForge iOS unsigned device build for Sideloadly.
# Place this file at the ROOT of the GitHub repository as codemagic.yaml.
# It supports either project.yml at the repository root (recommended) or
# an existing SculptForge/project.yml subfolder.
workflows:
  sculptforge-unsigned-ios:
    name: SculptForge — unsigned IPA (Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project (validate paths)
        script: |
          set -euo pipefail
          ROOT="${CM_BUILD_DIR:-$PWD}"
          if [ -f "$ROOT/project.yml" ]; then
            APP_ROOT="$ROOT"
          elif [ -f "$ROOT/SculptForge/project.yml" ]; then
            APP_ROOT="$ROOT/SculptForge"
          else
            echo 'ERROR: project.yml not found at the repository root or SculptForge/project.yml.' >&2
            echo 'Extract the ZIP locally, then upload its folders/files to GitHub; do not upload the ZIP itself.' >&2
            find "$ROOT" -maxdepth 3 -name project.yml -print
            exit 1
          fi
          echo "Using project at: $APP_ROOT"
          cd "$APP_ROOT"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec project.yml
          test -d SculptForge.xcodeproj || { echo 'ERROR: XcodeGen did not create SculptForge.xcodeproj'; exit 1; }
          xcodebuild -list -project SculptForge.xcodeproj
          xcodebuild -version
      - name: Ensure Metal compiler is installed
        script: |
          set -euo pipefail
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --find metal
      - name: Archive iOS device app (no signing)
        script: |
          set -euo pipefail
          ROOT="${CM_BUILD_DIR:-$PWD}"
          APP_ROOT="$ROOT"
          if [ ! -f "$APP_ROOT/project.yml" ]; then APP_ROOT="$ROOT/SculptForge"; fi
          cd "$APP_ROOT"
          test -d SculptForge.xcodeproj || { echo 'ERROR: SculptForge.xcodeproj missing: project generation failed'; exit 1; }
          mkdir -p "$ROOT/build"
          xcodebuild archive \
            -project SculptForge.xcodeproj \
            -scheme SculptForge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ROOT/build/SculptForge.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$ROOT/build/archive.log"
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          ROOT="${CM_BUILD_DIR:-$PWD}"
          APP_ROOT="$ROOT"
          if [ ! -f "$APP_ROOT/project.yml" ]; then APP_ROOT="$ROOT/SculptForge"; fi
          bash "$APP_ROOT/Scripts/make_ipa.sh" \
            "$ROOT/build/SculptForge.xcarchive" \
            "$ROOT/build/SculptForge-unsigned.ipa"
          unzip -t "$ROOT/build/SculptForge-unsigned.ipa"
    artifacts:
      - build/SculptForge-unsigned.ipa
      - build/archive.log
